# LOCAL DEVELOPMENT overrides — loaded automatically by `docker compose` / `make up`,
# merged on top of compose.yaml. Never used in production (Coolify deploys compose.yaml only).
#
# Adds: dev images with hot reload, source-code bind mounts, published ports, Mailpit.
# Browser entry point: http://localhost:${APP_PORT:-8000}

x-backend-dev: &backend-dev
  build:
    context: ./backend
    target: development
  image: smartkids-backend:dev
  volumes:
    - ./backend:/app
  environment:
    ENVIRONMENT: development
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://localhost:5173}
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    SEED_DEMO_DATA: "false"

services:
  db:
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"

  seaweedfs:
    ports:
      - "${SEAWEEDFS_MASTER_HOST_PORT:-9333}:9333" # master UI

  backend:
    <<: *backend-dev
    command: ["sh", "/app/scripts/start-dev.sh"]

  worker:
    <<: *backend-dev

  scheduler:
    <<: *backend-dev

  frontend:
    build:
      context: ./frontend
      target: development
    image: smartkids-frontend:dev
    environment:
      APP_PORT: ${APP_PORT:-8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]

  # Dev-only edge proxy: /api -> backend, files -> SeaweedFS, everything else -> Vite (hot reload).
  # (In production the frontend container does this itself.)
  nginx:
    build: ./infra/nginx
    environment:
      FRONTEND_UPSTREAM: frontend:5173
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-smartkids-public}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-smartkids-private}
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # Catches all outgoing email in development: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_HOST_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  frontend_node_modules:
