# SmartKids – Smile & Grow — Docker Compose
#
# This file is the PRODUCTION stack and is what Coolify (or any server) deploys:
#   docker compose -f compose.yaml up -d --build
#
# For local development, `docker compose up` / `make up` ALSO loads compose.override.yaml
# automatically, which switches to dev images, mounts the source code and publishes ports.
#
# Rules for this file:
#   * No bind mounts — every config file is baked into an image (infra/*/Dockerfile),
#     because platforms like Coolify do not have the repository files on the host.
#   * No published host ports — the platform's proxy routes the domain to `frontend:80`.
#   * Configuration comes only from environment variables (set them in Coolify).
#     Variables marked :? are required; the deployment fails fast if they are missing.

name: smartkids

x-backend-env: &backend-env
  ENVIRONMENT: production
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL to the public https URL of the app}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a long random string}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  CORS_ORIGINS: ${PUBLIC_BASE_URL}
  POSTGRES_DB: ${POSTGRES_DB:-smartkids}
  POSTGRES_USER: ${POSTGRES_USER:-smartkids}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-smartkids}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
  S3_REGION: us-east-1
  S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-smartkids-public}
  S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-smartkids-private}
  S3_PRESIGNED_EXPIRE_SECONDS: ${S3_PRESIGNED_EXPIRE_SECONDS:-900}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  EMAIL_FROM: ${EMAIL_FROM:-no-reply@example.com}
  SIGNAL_WINDOW_DAYS: ${SIGNAL_WINDOW_DAYS:-7}
  SIGNAL_BASELINE_DAYS: ${SIGNAL_BASELINE_DAYS:-28}
  SIGNAL_MIN_REPORTS: ${SIGNAL_MIN_REPORTS:-4}
  SIGNAL_RATIO_THRESHOLD: ${SIGNAL_RATIO_THRESHOLD:-2.0}
  AGGREGATE_MIN_CELL_SIZE: ${AGGREGATE_MIN_CELL_SIZE:-3}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  # true = load the fictional demo data on first start (only if the database has no users)
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
  # true = demo families keep generating realistic activity (admins can also toggle this in Settings)
  DEMO_MODE: ${DEMO_MODE:-false}
  DEMO_ACTIVITY_INTERVAL_SECONDS: ${DEMO_ACTIVITY_INTERVAL_SECONDS:-180}
  # Google sign-in placeholder (not implemented yet)
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

x-backend: &backend
  build:
    context: ./backend
    target: production
  environment: *backend-env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    seaweedfs:
      condition: service_healthy

services:
  db:
    build: ./infra/postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartkids}
      POSTGRES_USER: ${POSTGRES_USER:-smartkids}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Healthy only after POSTGRES_PASSWORD has been applied (infra/postgres/sync-password.sh)
      test: ["CMD-SHELL", "pg_isready -q -U $${POSTGRES_USER} -d $${POSTGRES_DB} && test -f /tmp/password-synced"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  seaweedfs:
    build: ./infra/seaweedfs
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-smartkids}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-smartkids-public}
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz && wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  backend:
    <<: *backend
    command: ["sh", "/app/scripts/start-prod.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      backend:
        condition: service_healthy

  scheduler:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      backend:
        condition: service_healthy

  # PUBLIC ENTRY POINT — the only service that receives traffic.
  # Serves the built web app and forwards /api and file requests to the backend and SeaweedFS.
  # In Coolify, the domain goes on this service (port 80).
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-}
    environment:
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-smartkids-public}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-smartkids-private}
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
